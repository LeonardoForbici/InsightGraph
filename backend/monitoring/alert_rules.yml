groups:
  - name: insightgraph-alerts
    rules:
      - alert: HighEventPropagationLatency
        expr: histogram_quantile(0.95, sum(rate(ig_event_propagation_latency_seconds_bucket[5m])) by (le, event_type)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event propagation latency is above p95 500ms"
      - alert: WebSocketConnectionsDrop
        expr: ig_websocket_connections < 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "No active WebSocket clients for 10 minutes"
      - alert: PredictionTrafficMissing
        expr: rate(ig_prediction_requests_total[15m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No prediction requests in the last 30 minutes"
