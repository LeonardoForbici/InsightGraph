worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    gzip on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream insightgraph_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 443 ssl http2;
        server_name insightgraph.local;

        ssl_certificate /etc/ssl/certs/insightgraph.crt;
        ssl_certificate_key /etc/ssl/private/insightgraph.key;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers on;

        location /ws {
            proxy_pass http://insightgraph_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 180;
            proxy_send_timeout 180;
        }

        location / {
            proxy_pass http://insightgraph_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;
        server_name insightgraph.local;
        return 301 https://$host$request_uri;
    }
}
